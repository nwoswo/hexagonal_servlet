version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ordenes-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ordenes_db
      MYSQL_USER: ordenes_user
      MYSQL_PASSWORD: ordenes_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ordenes-network

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ordenes-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ordenes-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ordenes-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - ordenes-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ordenes-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ordenes-network

  # Fake Inventory Service
  inventory-service:
    image: mockserver/mockserver:5.15.0
    container_name: ordenes-inventory-service
    ports:
      - "8081:1080"
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
    volumes:
      - ./mock-services/inventory-mock.json:/config/mockserver.properties
    networks:
      - ordenes-network

  # Fake Payment Service
  payment-service:
    image: mockserver/mockserver:5.15.0
    container_name: ordenes-payment-service
    ports:
      - "8082:1080"
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
    volumes:
      - ./mock-services/payment-mock.json:/config/mockserver.properties
    networks:
      - ordenes-network

volumes:
  mysql_data:
  rabbitmq_data:

networks:
  ordenes-network:
    driver: bridge 