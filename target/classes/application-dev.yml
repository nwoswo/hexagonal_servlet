spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ordenes-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Kafka topics configuration
kafka:
  topics:
    orden-created: orden-created
    orden-updated: orden-updated
    orden-cancelled: orden-cancelled
    item-orden-created: item-orden-created
    item-orden-updated: item-orden-updated
    item-orden-deleted: item-orden-deleted

# RabbitMQ queues configuration
rabbitmq:
  queues:
    orden-created: orden-created
    orden-cancelled: orden-cancelled
    item-orden-created: item-orden-created

# External service configuration
external:
  services:
    inventory:
      url: http://localhost:8081/api/inventory
      timeout: 5000
    payment:
      url: http://localhost:8082/api/payment
      timeout: 5000 